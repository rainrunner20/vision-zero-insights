services:
  - type: web
    name: visionzero-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      # Set this secret in Render's dashboard; never commit its value.
      - key: DATABASE_URL
        sync: false
      - key: VISIONZERO_ALLOWED_ORIGINS
        value: http://localhost:5173
